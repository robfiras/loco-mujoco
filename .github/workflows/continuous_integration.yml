# This workflow will install Python dependencies, run tests and lint with a single version of Python.
# Runs on: push to master or dev, and pull requests into them.

name: Continuous Integration

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:   # allows "Run workflow" from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: 3.11
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # CPU-only torch keeps the SMPL extra small; the tests do not need a GPU
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # the optional extras are installed so that their tests run instead of being skipped
        pip install -e ".[test,usd,viser,smpl,blender]"
#    - name: Lint with flake8
#      run: |
#        # stop the build if there are Python syntax errors or undefined names
#        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
#        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
#        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Cache robot models
      uses: actions/cache@v4
      with:
        path: ~/.loco-mujoco-caches/robot_models
        key: robot-models-${{ hashFiles('loco_mujoco/core/utils/models.py') }}
    - name: Download robot models
      run: loco-mujoco-download-models
    - name: Test with pytest
      run: |
        # One pytest process per test file: JAX keeps compiled functions in memory, and
        # the whole suite in a single process peaks close to the runner's 16 GB.
        status=0
        for f in tests/test_*.py; do
          [ "$f" = tests/test_task_factories.py ] && continue
          pytest "$f" --cov=loco_mujoco --cov-append --cov-report= || status=1
        done
        python -m coverage report --skip-covered
        python -m coverage xml
        python -m coverage html
        exit $status
    - name: Publish coverage summary
      if: always()
      run: |
        echo '### Test coverage' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        python -m coverage report --skip-covered | tail -n 40 >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov
