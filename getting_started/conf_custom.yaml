defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic


wandb:
  project: "deepmimic"
  run_name: "MjxSkeletonMuscleImitation"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      default_dataset_conf:
          task: walk
      # lafan1_dataset_conf:
      #   dataset_name:
      #     - walk1_subject1
  env_params:
    env_name: MjxSkeletonMuscle #SkeletonMuscle #MjxMyoSkeleton
    headless: True
    disable_arms: false
    horizon: 1000
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.4
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.1
      sites_for_mimic:
        - upper_body_mimic
        # - head_mimic
        # - pelvis_mimic
        - left_hand_mimic
        ##- left_elbow_mimic
        #- left_shoulder_mimic
        #- left_hip_mimic
        #- left_knee_mimic
        - left_foot_mimic
        - right_hand_mimic
        #- right_elbow_mimic
        #- right_shoulder_mimic
        #- right_hip_mimic
        #- right_knee_mimic
        - right_foot_mimic
  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 2048
  num_steps: 200
  total_timesteps: 900e6 #300e6
  update_epochs: 4
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.2
  learnable_std: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  number_upper_body_activation: 14
  custom_output_activation: ["tanh", "sigmoid"]
  activation: tanh #sigmoid #tanh
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1  # will automatically take seeds from 1 to n_seeds
  vmap_across_seeds: true
  validation: 
    active: true 
    num_steps: 100
    num_envs: 100
    num: 10 # set to 0 to disable validation
    # if none of the following is set, only the mean reward and episode length is logged
    quantities: # quantities to be used for the distance measures below
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteVelocity
      - RelSiteOrientation
    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance
    rel_site_names:
      - upper_body_mimic
      - left_hand_mimic
      - left_foot_mimic
      - right_hand_mimic
      - right_foot_mimic
    # joints_to_ignore:
    #   - lumbar5
    #   - lumbar4
    #   - lumbar3
    #   - lumbar2
    #   - lumbar1

# Define control subconfigs
control_config:
 torque_control:
    control_type: DefaultControl
    control_params: