experiment:
  task_factory:
    name: RLFactory
    params: {}
  env_params:
    env_name: MjxBDSpot
    horizon: 1000
    terminal_state_type: HeightBasedTerminalStateHandler
    goal_type: GoalRandomRootVelocity
    goal_params:
        visualize_goal: true
    headless: true
    reward_type: LocomotionReward
    reward_params:
        air_time_coeff: 0.0
        joint_acc_coeff: 2e-7
        air_time_max: 0.5
        joint_torque_coeff: 2e-5
        joint_position_limit_coeff: 5.0
        action_rate_coeff: 0.01
        symmetry_air_coeff: 0.0
        energy_coeff: 0.0
    terrain_type: RoughTerrain
    init_state_type: TrajInitialStateHandler
  hidden_layers: [64, 64]
  activation: relu
  lr_actor: 3e-4
  lr_critic: 3e-4
  exploration_noise: 0.1
  target_noise: 0.1
  noise_clip: 0.3
  policy_delay: 2
  lambda_oob: 0.1
  use_obs_norm: false
  gamma: 0.99
  tau: 0.005
  buffer_size: 1000
  batch_size: 32
  learning_starts: 32
  gradient_steps: 20
  max_grad_norm: 0.5
  num_envs: 4
  total_timesteps: 200
  normalize_env: false
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: false
    num_steps: 10
    num_envs: 4
    num: 1
