experiment:
  task_factory:
    name: RLFactory
    params: {}
  env_params:
    env_name: MjxBDSpot
    horizon: 1000
    terminal_state_type: HeightBasedTerminalStateHandler
    goal_type: GoalRandomRootVelocity
    goal_params:
        visualize_goal: true
    headless: true
    reward_type: LocomotionReward
    reward_params:
        air_time_coeff: 0.0
        joint_acc_coeff: 2e-7
        air_time_max: 0.5
        joint_torque_coeff: 2e-5
        joint_position_limit_coeff: 5.0
        action_rate_coeff: 0.01
        symmetry_air_coeff: 0.0
        energy_coeff: 0.0
    terrain_type: RoughTerrain
    init_state_type: TrajInitialStateHandler
  hidden_layers: [64, 64]
  z_dim: 8
  init_std_z: 0.1
  lr: 3e-4
  num_envs: 4
  num_steps: 16
  total_timesteps: 64
  update_epochs: 2
  num_minibatches: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 1.0
  learnable_std: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: false
    num_steps: 16
    num_envs: 4
    num: 1
  # S2PG2-specific knobs:
  z_coef: 1.0
  vf_z_coef: 0.5
  ent_z_coef: 0.0
  # gamma_z, gae_lambda_z default to gamma, gae_lambda when unset.
