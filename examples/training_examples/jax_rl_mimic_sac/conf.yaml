defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "deepmimic-SAC"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      lafan1_dataset_conf:
        dataset_name:
          - walk1_subject5
  env_params:
    env_name: MjxUnitreeG1
    headless: True
    horizon: 1000
    use_mjwarp: False
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.4
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.1
      sites_for_mimic:
        - upper_body_mimic
        - left_hand_mimic
        - left_foot_mimic
        - right_hand_mimic
        - right_foot_mimic
  hidden_layers: [256, 256]
  activation: tanh
  init_std: 0.1
  learnable_std: true
  state_dependent_std: true
  lr_actor: 3e-4
  lr_critic: 3e-4
  lr_alpha: 3e-4
  init_alpha: 0.01
  learnable_alpha: true
  # target_entropy: set to action_dim * log(init_std) to match desired init_std;
  # default (-action_dim) assumes std ≈ 1.0 which fights small init_std
  target_entropy: -200.7  # 19 * log(0.1) ≈ 19 * -2.3 for UnitreeG1 (19 actuators)
  gamma: 0.99
  tau: 0.005
  buffer_size: 1000000
  batch_size: 256
  learning_starts: 1000000
  gradient_steps: 20
  max_grad_norm: 0.5
  num_envs: 2048
  total_timesteps: 10e6
  # Aggregate metrics over `log_every` outer-loop iterations before emitting
  # one wandb row. Each iteration = one vmapped env step (`num_envs` frames
  # collected in parallel) + `gradient_steps` updates. So with num_envs=2048
  # and log_every=100, a row is emitted every 100 * 2048 = 204_800 env frames.
  log_every: 100
  # NOTE: off-policy learning is incompatible with running-stat normalization
  # because stale replay-buffer transitions were normalized under old stats,
  # while the current critic / target critic use newer stats — leading to
  # silently inconsistent Bellman residuals. Keep both off for SAC/TD3.
  normalize_env: false    # disables NormalizeVecReward wrapper
  use_obs_norm: false     # disables RunningMeanStd inside actor/critic nets
  log_std_min: -20.0
  log_std_max: 2.0
  n_seeds: 1
  vmap_across_seeds: true
  debug: false
  validation:
    active: false
    num_steps: 100
    num_envs: 100
    num: 1

# Define control subconfigs
control_config:
  position_control:
    control_type: PDControl
    control_params:
      p_gain:
        - 300  # back_bkz_actuator -> torso
        - 100  # l_arm_shy_actuator -> shoulder
        - 100  # l_arm_shx_actuator -> shoulder
        - 100  # l_arm_shz_actuator -> shoulder
        - 100  # left_elbow_actuator -> elbow
        - 100  # r_arm_shy_actuator -> shoulder
        - 100  # r_arm_shx_actuator -> shoulder
        - 100  # r_arm_shz_actuator -> shoulder
        - 100  # right_elbow_actuator -> elbow
        - 200  # hip_flexion_r_actuator -> hip_pitch
        - 200  # hip_adduction_r_actuator -> hip_roll
        - 200  # hip_rotation_r_actuator -> hip_yaw
        - 300  # knee_angle_r_actuator -> knee
        - 40   # ankle_angle_r_actuator -> ankle
        - 200  # hip_flexion_l_actuator -> hip_pitch
        - 200  # hip_adduction_l_actuator -> hip_roll
        - 200  # hip_rotation_l_actuator -> hip_yaw
        - 300  # knee_angle_l_actuator -> knee
        - 40   # ankle_angle_l_actuator -> ankle
      d_gain:
        - 6  # back_bkz_actuator -> torso
        - 2  # l_arm_shy_actuator -> shoulder
        - 2  # l_arm_shx_actuator -> shoulder
        - 2  # l_arm_shz_actuator -> shoulder
        - 2  # left_elbow_actuator -> elbow
        - 2  # r_arm_shy_actuator -> shoulder
        - 2  # r_arm_shx_actuator -> shoulder
        - 2  # r_arm_shz_actuator -> shoulder
        - 2  # right_elbow_actuator -> elbow
        - 5  # hip_flexion_r_actuator -> hip_pitch
        - 5  # hip_adduction_r_actuator -> hip_roll
        - 5  # hip_rotation_r_actuator -> hip_yaw
        - 6  # knee_angle_r_actuator -> knee
        - 2  # ankle_angle_r_actuator -> ankle
        - 5  # hip_flexion_l_actuator -> hip_pitch
        - 5  # hip_adduction_l_actuator -> hip_roll
        - 5  # hip_rotation_l_actuator -> hip_yaw
        - 6  # knee_angle_l_actuator -> knee
        - 2  # ankle_angle_l_actuator -> ankle

  torque_control:
    control_type: DefaultControl
    control_params:
