defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "dagger-distill-traj-swap"

# seed that drives which pair is picked at each chunk
swap_seed: 0

# Flat list of (expert_ckpt, traj) pairs. One entry = one chunk-sample unit.
#
# The same expert may appear in multiple entries — that's how you express
# "this expert handles N trajs" (one entry per traj). It also gives you free
# weighting: list an entry more often to sample it more often.
#
# All experts must share the architecture declared under experiment.teacher
# below. Experts are cached by ckpt path, so repetition costs nothing.
traj_swap:
  dataset_type: mocap
  pairs:
    # expert_walk: covers three walking styles
    - expert_ckpt:  /home/moore/PycharmProjects/loco-mujoco/outputs/2026-04-21/16-42-08/PPOJax_saved.pkl
      traj: squat
    - expert_ckpt: /home/moore/PycharmProjects/loco-mujoco/outputs/2026-04-21/17-01-20/PPOJax_saved.pkl
      traj: stepinplace1


experiment:
  task_factory:
    name: ImitationFactory
    params:
      # Bootstrap env with one of the tasks; swapping handled per chunk.
      default_dataset_conf:
        task: squat
        dataset_type: mocap
  env_params:
    env_name: MjxUnitreeH1
    headless: True
    horizon: 1000
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.4
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.1
      sites_for_mimic:
        - upper_body_mimic
        - left_hand_mimic
        - left_foot_mimic
        - right_hand_mimic
        - right_foot_mimic

  student:
    hidden_layers: [256, 256]
    activation: tanh
    init_std: 0.1
    learnable_std: true

  teacher:
    # Must match the architecture of every expert checkpoint listed above.
    hidden_layers: [512, 256]
    activation: tanh
    init_std: 0.05
    learnable_std: false

  teacher_beta: 0.5
  sticky_min: 5
  sticky_max: 50

  buffer_size: 2_000_000
  batch_size: 512
  learning_starts: 8192
  gradient_steps: 1

  lr: 3e-4
  max_grad_norm: 0.5
  weight_decay: 0.0

  num_envs: 2048
  total_timesteps: 60e6
  timesteps_per_chunk: 2e6

  # Periodic evaluation
  # After every eval_interval_steps environment steps, run the student on
  # each unique (expert, traj) pair and log per-pair + mean return/length.
  # Set to 0 to disable.
  eval_interval_steps: 5e7
  eval_num_envs: 64
  eval_num_steps: 500

  debug: false

control_config:
  torque_control:
    control_type: DefaultControl
    control_params:
