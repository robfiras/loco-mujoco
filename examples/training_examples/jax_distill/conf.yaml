defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "dagger-distill"

# Path to the saved teacher (a PPOJax checkpoint, e.g. PPOJax_saved.pkl).
# Override at the CLI: `python experiment.py teacher_ckpt=/path/to/teacher.pkl`
teacher_ckpt: ???

experiment:
  task_factory:
    name: ImitationFactory
    params:
      lafan1_dataset_conf:
        dataset_name:
          - walk1_subject5
  env_params:
    env_name: MjxUnitreeG1
    headless: True
    horizon: 1000
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.4
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.1
      sites_for_mimic:
        - upper_body_mimic
        - left_hand_mimic
        - left_foot_mimic
        - right_hand_mimic
        - right_foot_mimic

  # Student network (the thing being trained).
  student:
    hidden_layers: [256, 256]
    activation: tanh
    init_std: 0.1
    learnable_std: true
    # Optional: filter observations into different groups for actor vs critic.
    # Leave unset (or null) to feed the full obs to both heads.
    # actor_obs_group: policy
    # critic_obs_group: prioritized

  # Teacher network — must match the architecture *and* obs filters of the
  # loaded checkpoint. If the teacher was trained with actor_obs_group=...,
  # set it here too (otherwise the kernel shapes will mismatch at apply time).
  teacher:
    hidden_layers: [512, 256]
    activation: tanh
    init_std: 0.05
    learnable_std: false
    # actor_obs_group: policy
    # critic_obs_group: prioritized

  # DAgger hyperparameters
  teacher_beta: 0.5       # P(act with teacher) at each fresh sample
  sticky_min: 5           # uniform [min, max] horizon for sticky mixture
  sticky_max: 50

  # Critic learning via teacher-value distillation. The buffer stores
  # V_teacher(s) at collect time; the student's critic is trained to
  # match it. No TD bootstrap, no next_obs needed.
  use_critic_learning: true
  critic_loss_coef: 0.5

  # Buffer columns — defaults: store_next_obs=false, store_value_target
  # follows use_critic_learning. Override only if you're extending this
  # with an algorithm that needs a different column set.
  # store_next_obs: false
  # store_value_target: true

  # Short-term rolling buffer (FIFO).
  buffer_size: 1_000_000
  # Long-term reservoir memory — uniform sample of all transitions ever
  # seen. Training batches split 50/50 between short and long. 0 disables.
  long_term_buffer_size: 1_000_000
  # Floor on reservoir inclusion probability. 0.0 = pure reservoir over
  # all history. A positive value caps effective history horizon at
  # capacity / p_min — useful when the rollout distribution drifts.
  long_term_min_include_prob: 0.0
  batch_size: 512
  learning_starts: 4096
  gradient_steps: 1

  # Student optimizer
  lr: 3e-4
  max_grad_norm: 0.5
  weight_decay: 0.0

  # Scale
  num_envs: 2048
  total_timesteps: 20e6
  timesteps_per_chunk: 1e6

  debug: false

# Torque/position control definitions — shared by the env_params reference above.
control_config:
  torque_control:
    control_type: DefaultControl
    control_params:
