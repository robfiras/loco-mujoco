[build-system]
requires = ["setuptools", "wheel", "wget", "pyyaml"]

[project]
name = "loco-mujoco"
dependencies = [
    "numpy>2.0",
    "scipy>=1.14.0",
    "mujoco>=3.5.0",
    "mujoco-mjx>=3.5.0",
    "mujoco-warp>=3.5.0",
    "hydra-core",
    "jax",
    "flax",
    "orbax",
    "distrax",
    "metrx",
    "gymnasium",
    "pyyaml",
    "opencv-python",
    "wget",
    "gitpython",
    "datasets",
    "huggingface_hub",
    "loco-mujoco-models @ git+https://github.com/robfiras/loco-mujoco-models.git"]

requires-python = ">=3.10"
authors = [{name="Firas Al-Hafez", email="fi.alhafez@gmail.com"}]
maintainers = [{ name="Firas Al-Hafez", email="fi.alhafez@gmail.com"}]
description = 'Imitation learning benchmark focusing on complex locomotion tasks using MuJoCo.'
readme = "README.md"
license = { file= "LICENSE" }
keywords = ["Imitation Learning", "Reinforcement Learning", "Locomotion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["."]

[tool.coverage.run]
source = ["loco_mujoco"]
branch = false
omit = [
    # Interactive OpenGL viewer: opens a GUI window / requires a live display,
    # so it cannot run under headless CI. Excluded from the coverage metric.
    "*/loco_mujoco/core/visuals/viewer.py",
    # Namespace/boilerplate that carries no testable logic.
    "*/loco_mujoco/**/__init__.py",
    # Un-CI-able: these require external, *gated* assets that cannot be fetched in
    # CI, so mocking them would only test the mock. Same rationale as the viewer.
    #   - retarget_for_env: CLI that lists+downloads clips from the HuggingFace repo
    #     and SMPL-fits them; nothing real runs without the network + SMPL model.
    #   - generate_smplh_model: reads the license-restricted SMPL + MANO model files.
    #   - myomodel_init: `loco-mujoco-myomodel-init` git-clones a gated model repo.
    #   - myoskeleton (+ _mjx): env loader downloads that same gated model; the
    #     env-construction test already skips it for this reason.
    "*/loco_mujoco/utils/retarget_for_env.py",
    "*/loco_mujoco/smpl/generate_smplh_model.py",
    "*/loco_mujoco/utils/myomodel_init.py",
    "*/loco_mujoco/environments/humanoids/myoskeleton.py",
    "*/loco_mujoco/environments/humanoids/myoskeleton_mjx.py",
]

[tool.coverage.report]
# Lines/blocks that are intentionally not exercised by the test suite.
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    # play_policy / play_policy_mujoco render every step (they call env.render /
    # env.mjx_render unconditionally, ignoring the `render` flag), so they need a
    # live GL context and cannot run under headless CI -- same rationale as the
    # excluded interactive viewer. One entry covers every algorithm's variant.
    "def play_policy",
    # AMASS retargeting orchestration: both download the (large) AMASS datasets
    # AND require the license-restricted SMPL body model, so neither can run under
    # CI -- same rationale as the viewer. The heavy lifting they delegate to
    # (motion_transfer_robot_to_robot / fit_smpl_* / extend_motion) IS tested with
    # synthetic SMPL-H fixtures; only these two network-bound entry points are excluded.
    "def load_retargeted_amass_trajectory",
    "def retarget_traj_from_robot_to_robot",
]
show_missing = true
skip_covered = false

[project.optional-dependencies]
# To install SMPL, you need to accept the license as described here https://github.com/vchoutas/smplx
smpl = [
    "torch",
    "tqdm",
    "smplx @ git+https://github.com/ZhengyiLuo/smplx",
    "joblib",
]
# Browser-based rendering with viser, used by env.render_viser() and env.mjx_render_viser().
viser = [
    "viser>=1.0.27",
    "mjviser>=0.0.14",
    "trimesh>=4.8.3",
]
# Test/dev tooling. Install with: pip install -e ".[test]"
test = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/robfiras/loco-mujoco"
Repository = "https://github.com/robfiras/loco-mujoco"
Issues = "https://github.com/robfiras/loco-mujoco/issues"

[project.scripts]
loco-mujoco-download = "loco_mujoco.utils:download_all_datasets"
loco-mujoco-download-real = "loco_mujoco.utils:download_real_datasets"
loco-mujoco-download-perfect = "loco_mujoco.utils:download_perfect_datasets"
loco-mujoco-myomodel-init = "loco_mujoco.utils:fetch_myoskeleton"
loco-mujoco-myomodel-clear = "loco_mujoco.utils:clear_myoskeleton"
loco-mujoco-set-smpl-model-path = "loco_mujoco.utils:set_smpl_model_path"
loco-mujoco-set-amass-path = "loco_mujoco.utils:set_amass_path"
loco-mujoco-set-conv-amass-path = "loco_mujoco.utils:set_converted_amass_path"
loco-mujoco-set-lafan1-path = "loco_mujoco.utils:set_lafan1_path"
loco-mujoco-set-conv-lafan1-path = "loco_mujoco.utils:set_converted_lafan1_path"
loco-mujoco-set-all-caches = "loco_mujoco.utils:set_all_caches"
loco-mujoco-add-variable = "loco_mujoco.utils:add_variable_cli"
loco-mujoco-remove-variable = "loco_mujoco.utils:remove_variable_cli"
loco-mujoco-show-variable = "loco_mujoco.utils:show_variable_cli"
loco-mujoco-retarget-for-new-env = "loco_mujoco.utils:retarget_for_new_env_cli"
